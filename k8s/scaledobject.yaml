apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: framecast-worker
spec:
  scaleTargetRef:
    name: framecast-worker
  minReplicaCount: 2    # 2 pods sempre prontos — reduz cold start e distribui carga inicial
  maxReplicaCount: 10
  pollingInterval: 10   # verifica fila a cada 10s — reage rápido a picos
  cooldownPeriod: 60    # aguarda 1min antes de escalar para baixo
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-trigger-auth   # usa credenciais do framecast-worker-secret (sem IMDS)
      metadata:
        queueURL: SQS_QUEUE_URL_PLACEHOLDER   # substituído pelo k8s-configure
        queueLength: "3"                       # 1 pod por 3 mensagens na fila
        awsRegion: AWS_REGION_PLACEHOLDER      # substituído pelo k8s-configure
        scaleOnInFlight: "true"               # conta mensagens em processamento (invisíveis no SQS)
