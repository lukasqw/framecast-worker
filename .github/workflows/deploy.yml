name: Deploy

on:
  push:
    branches: ["main"]
    tags: ["v*"]

env:
  GO_VERSION: "1.25"
  AWS_REGION: us-east-1
  ECR_REPOSITORY: framecast-worker
  EKS_CLUSTER: framecast-eks
  K8S_NAMESPACE_DEV: framecast-dev
  K8S_NAMESPACE_PROD: framecast-prod
  K8S_DEPLOYMENT: framecast-worker

permissions:
  id-token: write   # OIDC
  contents: read

jobs:
  build-push:
    name: Build & Push ECR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Rollout
        run: |
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            worker=${{ needs.build-push.outputs.image }} \
            -n ${{ env.K8S_NAMESPACE_DEV }}
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE_DEV }} --timeout=5m

  deploy-prod:
    name: Deploy → prod
    runs-on: ubuntu-latest
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: prod   # gate de aprovação manual
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Rollout
        run: |
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            worker=${{ needs.build-push.outputs.image }} \
            -n ${{ env.K8S_NAMESPACE_PROD }}
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE_PROD }} --timeout=5m
