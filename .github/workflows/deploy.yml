name: Deploy
run-name: 🚀 ${{ github.event.pull_request.title || format('Deploy {0}', github.ref_name) }}

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        type: choice
        options:
          - production
          - staging
        default: production

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      image: ${{ steps.push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Extract Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG=$(git tag --sort=-v:refname | sed -n '1p'); TAG="${TAG:-v0.0.0}"
          else
            BRANCH="${{ github.event.pull_request.head.ref }}"
            TAG="${BRANCH#release/}"
          fi
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT
          echo "::notice::Version: $TAG"

      - name: Validate Required Secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]     && MISSING+=("AWS_ACCESS_KEY_ID")
          [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && MISSING+=("AWS_SECRET_ACCESS_KEY")
          [ -z "${{ secrets.DB_PASSWORD }}" ]            && MISSING+=("DB_PASSWORD")
          [ -z "${{ secrets.GHCR_PAT }}" ]               && MISSING+=("GHCR_PAT")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Required secrets missing: ${MISSING[*]}"
            exit 1
          fi

      # ===========================================
      # STAGE 1: Build & Push Docker image to GHCR
      # ===========================================
      - name: Build & Push Docker Image
        id: push
        uses: ./.github/actions/deploy/docker-push
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          image_tag: ${{ github.sha }}
          github_actor: ${{ github.actor }}
          ghcr_pat: ${{ secrets.GHCR_PAT }}

      # ===========================================
      # STAGE 2: Wire Terraform outputs → K8s
      # ===========================================
      - name: Configure K8s Resources
        uses: ./.github/actions/deploy/k8s-configure
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws_region: ${{ env.AWS_REGION }}
          eks_cluster: ${{ vars.EKS_CLUSTER || 'framecast' }}
          k8s_namespace: ${{ vars.K8S_NAMESPACE || 'framecast' }}
          tf_state_bucket: ${{ vars.TF_STATE_BUCKET || 'fiap-soat-tf-backend-framecast' }}
          db_password: ${{ secrets.DB_PASSWORD }}
          github_actor: ${{ github.actor }}
          ghcr_pat: ${{ secrets.GHCR_PAT }}
          image: ${{ steps.push.outputs.image }}
          worker_concurrency: ${{ vars.WORKER_CONCURRENCY || '3' }}
          ffmpeg_timeout_minutes: ${{ vars.FFMPEG_TIMEOUT_MINUTES || '10' }}
          ffmpeg_fps: ${{ vars.FFMPEG_FPS || '1' }}
          notifier_backend: ${{ vars.NOTIFIER_BACKEND || 'smtp' }}
          smtp_host: ${{ vars.SMTP_HOST || 'sandbox.smtp.mailtrap.io' }}
          smtp_port: ${{ vars.SMTP_PORT || '2525' }}
          smtp_username: ${{ vars.SMTP_USERNAME || '' }}
          smtp_from: ${{ vars.SMTP_FROM || 'noreply@framecast.local' }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}

      # ===========================================
      # STAGE 3: Roll out new image
      # ===========================================
      - name: Deploy to EKS
        uses: ./.github/actions/deploy/k8s-deploy
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws_region: ${{ env.AWS_REGION }}
          eks_cluster: ${{ vars.EKS_CLUSTER || 'framecast' }}
          k8s_namespace: ${{ vars.K8S_NAMESPACE || 'framecast' }}
          k8s_deployment: framecast-worker
          container_name: worker
          image: ${{ steps.push.outputs.image }}
          health_endpoint: ${{ vars.HEALTH_ENDPOINT || '/health' }}

      - name: Create Release
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/deploy/create-release
        with:
          version: ${{ steps.version.outputs.VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ steps.push.outputs.image }}
          environment: ${{ env.ENVIRONMENT }}

      - name: Deployment Summary
        if: always()
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Resource | Value |"
            echo "|----------|-------|"
            echo "| Version | \`${{ steps.version.outputs.VERSION }}\` |"
            echo "| Environment | \`${{ env.ENVIRONMENT }}\` |"
            echo "| Image | \`${{ steps.push.outputs.image }}\` |"
            echo "| Region | \`${{ env.AWS_REGION }}\` |"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Actor | @${{ github.actor }} |"
            echo "| Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> $GITHUB_STEP_SUMMARY
