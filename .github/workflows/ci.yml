name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # STAGE 1: Lint
  # ===========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go Lint
        uses: ./.github/actions/ci/go-lint
        with:
          go_version: ${{ vars.GO_VERSION || '1.25' }}

  # ===========================================
  # STAGE 2: Test + Build (parallel after lint)
  # ===========================================
  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go Test
        uses: ./.github/actions/ci/go-test
        with:
          go_version: ${{ vars.GO_VERSION || '1.25' }}
          coverage_gate: ${{ vars.COVERAGE_GATE || '60' }}

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go Build
        uses: ./.github/actions/ci/go-build
        with:
          go_version: ${{ vars.GO_VERSION || '1.25' }}
          binary_name: framecast-worker
          cmd_path: ./cmd/worker
