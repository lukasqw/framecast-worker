name: 'CI — Go Test'
description: 'Tests with FFmpeg + coverage gate + vulnerability check'

inputs:
  go_version:
    description: 'Go version'
    required: false
    default: '1.25'
  coverage_gate:
    description: 'Minimum coverage % (must be ≥ this value)'
    required: false
    default: '60'

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go_version }}
        cache: true

    - name: Install FFmpeg
      shell: bash
      run: sudo apt-get install -y ffmpeg

    - name: Run tests
      shell: bash
      run: go test ./... -race -coverprofile=cover.out -covermode=atomic

    - name: Coverage gate
      shell: bash
      run: |
        COVERAGE=$(go tool cover -func=cover.out | grep total | awk '{print $3}' | tr -d '%')
        echo "Cobertura: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < ${{ inputs.coverage_gate }}" | bc -l) )); then
          echo "::error::Cobertura abaixo do gate (${{ inputs.coverage_gate }}%): ${COVERAGE}%"
          exit 1
        fi

    - name: Vulnerability check
      shell: bash
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
