name: 'CI — Go Lint'
description: 'go vet + golangci-lint'

inputs:
  go_version:
    description: 'Go version'
    required: false
    default: '1.25'

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go_version }}
        cache: true

    - name: go mod tidy
      shell: bash
      run: go mod tidy

    - name: go vet
      shell: bash
      run: go vet ./...

    - name: golangci-lint
      shell: bash
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m
