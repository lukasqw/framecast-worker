name: 'CI — Go Lint'
description: 'go vet + golangci-lint'

inputs:
  go_version:
    description: 'Go version'
    required: false
    default: '1.25'

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go_version }}
        cache: true

    - name: go vet
      shell: bash
      run: go vet ./...

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m
