name: 'Deploy — Docker Push'
description: 'Build and push Docker image to Amazon ECR'

inputs:
  aws_access_key_id:
    description: 'AWS access key ID'
    required: true
  aws_secret_access_key:
    description: 'AWS secret access key'
    required: true
  aws_session_token:
    description: 'AWS session token (optional)'
    required: false
    default: ''
  aws_region:
    description: 'AWS region'
    required: false
    default: 'us-east-1'
  ecr_repository:
    description: 'ECR repository name'
    required: true
  image_tag:
    description: 'Docker image tag'
    required: true

outputs:
  image:
    description: 'Full ECR image URI (registry/repo:tag)'
    value: ${{ steps.image_uri.outputs.image }}
  registry:
    description: 'ECR registry URI'
    value: ${{ steps.login.outputs.registry }}

runs:
  using: composite
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-session-token: ${{ inputs.aws_session_token }}
        aws-region: ${{ inputs.aws_region }}

    - name: Login to Amazon ECR
      id: login
      uses: aws-actions/amazon-ecr-login@v2

    - name: Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build & Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ steps.login.outputs.registry }}/${{ inputs.ecr_repository }}:${{ inputs.image_tag }}
          ${{ steps.login.outputs.registry }}/${{ inputs.ecr_repository }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set Image URI Output
      id: image_uri
      shell: bash
      run: |
        echo "image=${{ steps.login.outputs.registry }}/${{ inputs.ecr_repository }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
