name: 'Deploy — Docker Push'
description: 'Build and push Docker image to GitHub Container Registry (GHCR)'

inputs:
  registry:
    description: 'Container registry hostname (e.g. ghcr.io)'
    required: false
    default: 'ghcr.io'
  image_name:
    description: 'Image name including owner (e.g. owner/repo)'
    required: true
  image_tag:
    description: 'Docker image tag'
    required: true
  github_actor:
    description: 'GitHub actor (GHCR username)'
    required: true
  ghcr_pat:
    description: 'GitHub Container Registry token (write:packages)'
    required: true

outputs:
  image:
    description: 'Full image URI (registry/image_name:tag)'
    value: ${{ steps.image_uri.outputs.image }}

runs:
  using: composite
  steps:
    - name: Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.github_actor }}
        password: ${{ inputs.ghcr_pat }}

    - name: Build & Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64
        tags: |
          ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
          ${{ inputs.registry }}/${{ inputs.image_name }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set Image URI Output
      id: image_uri
      shell: bash
      run: |
        echo "image=${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
