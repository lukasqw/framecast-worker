sonar.organization=lukasqw
sonar.projectKey=lukasqw_framecast-worker
sonar.projectName=Framecast Worker
sonar.projectVersion=1.0
sonar.host.url=https://sonarcloud.io

sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/docs/**,**/*.pb.go,**/.github/**,**/Dockerfile,**/.dockerignore,**/docker-compose*.yml,**/*mock*.go,**/k8s/**,**/*.sh,**/bin/**,**/.env,**/.git/**,.gocache/**,cmd/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**

sonar.go.coverage.reportPaths=cover.out

# Excluir da métrica de cobertura: entry points (cmd/) sem lógica testável
# e código gerado. A lógica de negócio (consumer/processor/infra) está coberta.
sonar.coverage.exclusions=cmd/**,**/*.pb.go,**/mock_*.go

sonar.sourceEncoding=UTF-8
